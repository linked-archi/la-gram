# ─────────────────────────────────────────────────────────────────
# nginx: la-gram at https://app.linked.archi/la-gram/
#
# The locations below go into the app.linked.archi server block of the host's
# site file (/etc/nginx/sites-available/linked-archi, which serves the other
# linked.archi sites too; meta.linked.archi's block is kept in linked-archi-meta).
# Keep the two the same: change them here, then copy them into the host's file.
#
# The pipeline's web-deploy job copies each release's web build into
# /var/www/linked-archi-app/la-gram (its LA_GRAM_DEPLOY_PATH), as the deploy user.
# Once, on the host:
#   sudo mkdir -p /var/www/linked-archi-app/la-gram
#   sudo chown -R deploy:www-data /var/www/linked-archi-app
#   (and a certificate for app.linked.archi, if it has none: certbot --nginx -d app.linked.archi)
#
# On the host, after a change: sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────

    # /la-gram, as people type it: the app's folder.
    location = /la-gram {
        absolute_redirect off;
        return 301 /la-gram/;
    }

    # ^~ — the server's regular-expression locations (an RDF one for .ttl, say)
    # do not take la-gram's files.
    location ^~ /la-gram/ {
        root /var/www/linked-archi-app;
        index index.html;
        try_files $uri $uri/ =404;

        gzip on;
        gzip_types text/css application/javascript image/svg+xml application/json application/wasm text/turtle;

        # The page and the bundled metamodels are checked on every load — the
        # metamodels' addresses carry ?v=<digest> and keep it while unchanged —
        # so a release is there on the next reload. The scripts and the
        # WebAssembly are named by their content: kept for a year.
        # (A location with add_header of its own inherits none: each repeats them.)
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        # Quoted: nginx reads the braces of {8,} as its own otherwise.
        location ~ "\.[0-9a-f]{8,}\.js$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ \.wasm$ {
            types { application/wasm wasm; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location ~ \.ttl$ {
            types { text/turtle ttl; }
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
