# la-gram's pipeline.
#
# A merge request, and the default branch: la-gram's tests, its web build, and
# la-gram-git's package built, packed, installed and run. Nothing is published.
# The desktop apps can be built by hand there (the desktop jobs are manual), to
# try them before a release.
#
# A release tag, la-gram-git-v<version> — the version in
# packages/la-gram-git/package.json: the same, then la-gram-git is published.
#
#   tag la-gram-git-v0.1.0      → npm @linked-archi/la-gram-git@0.1.0 (dist-tag latest)
#                                 image $CI_REGISTRY_IMAGE/la-gram-git:0.1.0, :0 and :latest,
#                                 for linux/amd64 and linux/arm64
#   tag la-gram-git-v0.2.0-rc.1 → npm under the dist-tag next; image :0.2.0-rc.1 only
#
# A release tag, la-gram-v<version> — the version in package.json: the tests,
# then la-gram is published.
#
#   tag la-gram-v0.1.0          → the desktop apps — macOS (Apple silicon, Intel),
#                                 Windows x64, Linux x64 and arm64 — in the project's
#                                 package registry and on its Releases page; the web
#                                 app at https://app.linked.archi/la-gram/
#   tag la-gram-v0.2.0-rc.1     → the desktop apps and the Release; the web app stays
#
# Other tags, and pushes to other branches, start nothing. Before the first
# release, and how to make one: README.md, "Releasing la-gram-git" and
# "Releasing la-gram".

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^la-gram-git-v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
    - if: $CI_COMMIT_TAG =~ /^la-gram-v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build
  - release

default:
  image: node:22
  # A newer push to the same merge request or branch cancels what is still running.
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push

variables:
  # Electron's binary for the runner is never run here: the desktop jobs package
  # each target with that target's Electron, which the packager downloads.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_audit: "false"
  npm_config_fund: "false"

# What publishes la-gram-git: on its release tag only, never cancelled half-way.
.release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^la-gram-git-v/
  interruptible: false
  cache: []

# Type check, and la-gram's unit and integration tests — la-gram-git is built from
# the same source. The benchmarks are left out: they time the machine they run on.
test:
  stage: test
  script:
    - npm ci --prefer-offline
    - npm run typecheck
    - npx vitest run --exclude '**/{*-bench,bench-*}.test.ts'

# The package, as npm will have it: built, packed, installed and run. On a release
# tag, the tag's version must be the package's. Not on la-gram's own release.
package:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^la-gram-v/
      when: never
    - when: on_success
  script:
    - PACKAGE_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("packages/la-gram-git/package.json", "utf8")).version')"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "${CI_COMMIT_TAG#la-gram-git-v}" != "$PACKAGE_VERSION" ]; then
        echo "The tag $CI_COMMIT_TAG says ${CI_COMMIT_TAG#la-gram-git-v}; packages/la-gram-git/package.json says $PACKAGE_VERSION."
        exit 1
      fi
    - npm ci --prefer-offline
    - npm run build:cli
    - (cd packages/la-gram-git && npm pack)
    # Installed from the packed file, as `npm install` installs it, then run on a model.
    - npm install --global "./packages/la-gram-git/linked-archi-la-gram-git-$PACKAGE_VERSION.tgz"
    - test "$(la-gram-git --version)" = "$PACKAGE_VERSION"
    - la-gram-git check packages/la-gram-git/smoke
  artifacts:
    paths:
      - packages/la-gram-git/linked-archi-la-gram-git-*.tgz
    expire_in: 1 week

# npm. After the first release, by trusted publishing: npm takes the pipeline's
# OIDC token (NPM_ID_TOKEN) for this project and this file, holds no secret, and
# publishes provenance with the package. The first release, before the package
# exists to configure that on, takes NPM_TOKEN — a protected, masked CI/CD
# variable — written to .npmrc as a reference that npm resolves, never as its value.
npm:
  extends: .release
  needs: [package]
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm install --global npm@11 # trusted publishing needs npm 11.5.1 or later
    - VERSION="${CI_COMMIT_TAG#la-gram-git-v}"
    - case "$VERSION" in *-*) DIST_TAG=next ;; *) DIST_TAG=latest ;; esac
    - if [ -n "${NPM_TOKEN:-}" ]; then echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"; fi
    - npm publish "./packages/la-gram-git/linked-archi-la-gram-git-$VERSION.tgz" --access public --tag "$DIST_TAG"

# The image, from the same packed file, into this project's container registry:
# built and tried natively on each platform — the default amd64 runner, and
# gitlab.com's Arm64 one — and pushed as <version>-<arch>; then container-image
# makes each published tag name both.
.image-build:
  extends: .release
  needs: [package]
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - VERSION="${CI_COMMIT_TAG#la-gram-git-v}"
    - IMAGE="$CI_REGISTRY_IMAGE/la-gram-git"
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg VERSION="$VERSION" --tag "$IMAGE:$VERSION-$ARCH" packages/la-gram-git
    - test "$(docker run --rm "$IMAGE:$VERSION-$ARCH" la-gram-git --version)" = "$VERSION"
    # The model goes in on the standard input: the Docker service cannot see the job's files.
    - docker run --rm --interactive "$IMAGE:$VERSION-$ARCH" sh -c 'cat > shop.ttl && la-gram-git check shop.ttl' < packages/la-gram-git/smoke/shop.ttl
    - docker push "$IMAGE:$VERSION-$ARCH"

image-amd64:
  extends: .image-build
  variables:
    ARCH: amd64

image-arm64:
  extends: .image-build
  tags: [saas-linux-small-arm64]
  # Docker-in-Docker on gitlab.com's Arm64 runners: the MTU GitLab's documentation
  # gives for them (hosted runners on Linux), or the build's downloads can stall.
  services:
    - name: docker:27.5.1-dind
      command: ["--mtu=1400"]
  variables:
    ARCH: arm64

# (Not named `image`: at the top of the file that is GitLab's keyword, not a job.)
container-image:
  extends: .release
  needs: [image-amd64, image-arm64]
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - VERSION="${CI_COMMIT_TAG#la-gram-git-v}"
    - IMAGE="$CI_REGISTRY_IMAGE/la-gram-git"
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - case "$VERSION" in *-*) TAGS="$VERSION" ;; *) TAGS="$VERSION ${VERSION%%.*} latest" ;; esac
    - |
      for TAG in $TAGS; do
        docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
      done
    - docker buildx imagetools inspect "$IMAGE:$VERSION"

# ── la-gram: the web app and the desktop apps ────────────────────
#
# On a la-gram-v<version> tag, the tag's version must be package.json's.
.la-gram-version: &la-gram-version
  - VERSION="$(node -p 'require("./package.json").version')"
  - |
    if [ -n "${CI_COMMIT_TAG:-}" ] && [ "${CI_COMMIT_TAG#la-gram-v}" != "$VERSION" ]; then
      echo "The tag $CI_COMMIT_TAG says ${CI_COMMIT_TAG#la-gram-v}; package.json says $VERSION."
      exit 1
    fi

# What publishes la-gram: on its release tag only, never cancelled half-way.
.la-gram-release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^la-gram-v/
  interruptible: false
  cache: []

# The web app, as app.linked.archi/la-gram/ serves it: every request, so a merge
# request that breaks the production build fails here.
web:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^la-gram-git-v/
      when: never
    - when: on_success
  script:
    - *la-gram-version
    - npm ci --prefer-offline
    - npm run build:web
    - test -f dist/web/index.html && test -f dist/web/favicon.svg && ls dist/web/*.wasm
    # The version, for the Releases page (its fields take variables, not shell).
    - echo "VERSION=$VERSION" > version.env
  artifacts:
    paths: [dist/web/]
    reports:
      dotenv: version.env
    expire_in: 1 week

# The desktop apps, each packaged on the Linux runner with its target's Electron:
# @electron/packager builds macOS and Windows apps off those systems. Not signed
# by a developer (the macOS app ad hoc): a downloaded copy asks to be allowed the
# first time (README.md, "Desktop app"). Zipped — the macOS app with its symbolic links, the Linux one
# as a tarball, which keeps the files' modes. On a release tag, uploaded to the
# project's generic package registry; on a merge request or the default branch,
# by hand, kept for three days as the job's artifact, to try.
desktop:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^la-gram-v/
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true
  parallel:
    matrix:
      - PLATFORM: darwin
        ARCH: [arm64, x64]
      - PLATFORM: win32
        ARCH: x64
      - PLATFORM: linux
        ARCH: [x64, arm64]
  script:
    - *la-gram-version
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends zip > /dev/null
    - npm ci --prefer-offline
    # Each target's Electron comes from GitHub, which now and then answers its
    # downloads with errors for minutes on end: tried three times, waiting
    # longer each time.
    - |
      for TRY in 1 2 3; do
        npm run package -- --platform "$PLATFORM" --arch "$ARCH" && break
        if [ "$TRY" = 3 ]; then exit 1; fi
        echo "Packaging failed (try $TRY of 3); again in $((TRY * 60)) s."
        sleep $((TRY * 60))
      done
    # macOS: the app's signature made whole. Packaged off macOS, the app keeps
    # Electron's ad-hoc signature on its binary but no valid seal over the renamed
    # bundle, and macOS calls a downloaded copy "damaged", with no way to open it.
    # Signed ad hoc again — with rcodesign, pinned and its checksum checked — it is
    # an app from an unidentified developer instead, which Privacy & Security's
    # Open Anyway opens. Signing with a Developer ID and notarising would end the
    # question; rcodesign does both, given Apple's credentials.
    - |
      if [ "$PLATFORM" = darwin ]; then
        RCODESIGN=apple-codesign-0.29.0-x86_64-unknown-linux-musl
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors --output rcodesign.tar.gz \
          "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/$RCODESIGN.tar.gz"
        echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rcodesign.tar.gz" | sha256sum --check -
        tar -xzf rcodesign.tar.gz
        "$RCODESIGN/rcodesign" sign "dist/packages/la-gram-$PLATFORM-$ARCH/la-gram.app"
      fi
    - mkdir -p release
    - NAME="la-gram-$VERSION-$PLATFORM-$ARCH"
    - |
      cd dist/packages
      if [ "$PLATFORM" = linux ]; then
        FILE="$NAME.tar.gz"
        tar -czf "../../release/$FILE" "la-gram-$PLATFORM-$ARCH"
      else
        FILE="$NAME.zip"
        zip -qry "../../release/$FILE" "la-gram-$PLATFORM-$ARCH"
      fi
      cd ../..
    - ls -l release
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "release/$FILE" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/la-gram/$VERSION/$FILE"
        echo "Uploaded $FILE"
      fi
  artifacts:
    paths: [release/]
    expire_in: 3 days

# The web app onto the server that serves app.linked.archi — the host that
# serves meta.linked.archi — over SSH: the build into LA_GRAM_DEPLOY_PATH, files
# no longer built taken away. The host's nginx serves it under /la-gram/ (its
# site for app.linked.archi, kept with the host's configuration).
#
# CI/CD variables (Settings → CI/CD → Variables), as meta.linked.archi's deploy has,
# each protected, scoped to the environment production (only this job sees them),
# variable references not expanded (README.md, "Releasing la-gram"):
#   DEPLOY_SSH_KEY       the deploy user's private SSH key (type File; Visible: a
#                        key of several lines cannot be masked, and as a File its
#                        value is never printed — the job gets a file's path)
#   DEPLOY_HOST          the server (app.linked.archi)
#   DEPLOY_USER          the SSH user (deploy)
#   LA_GRAM_DEPLOY_PATH  the folder nginx serves as /la-gram/ (/var/www/linked-archi-app/la-gram)
web-deploy:
  extends: .la-gram-release
  # A pre-release (la-gram-v0.3.0-rc.1) is not put in place of the web app:
  # its desktop apps and Release only.
  rules:
    - if: $CI_COMMIT_TAG =~ /^la-gram-v\d+\.\d+\.\d+$/
  needs: [web]
  image: alpine:3.22
  resource_group: app-linked-archi
  environment:
    name: production
    url: https://app.linked.archi/la-gram/
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519,ecdsa,rsa "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - test -n "$LA_GRAM_DEPLOY_PATH"
    - echo "Deploying to $DEPLOY_USER@$DEPLOY_HOST:$LA_GRAM_DEPLOY_PATH"
    - rsync -az --delete --chmod=D755,F644 dist/web/ "$DEPLOY_USER@$DEPLOY_HOST:$LA_GRAM_DEPLOY_PATH/"

# The Releases page: the version, the desktop apps from the package registry,
# and the web app.
la-gram-release:
  extends: .la-gram-release
  needs:
    - job: desktop
      artifacts: false
    - job: web-deploy # not on a pre-release
      artifacts: false
      optional: true
    - job: web # VERSION
      artifacts: true
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - echo "la-gram $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: la-gram $VERSION
    description: |
      la-gram, the semantic modeller for enterprise and IT architecture.

      **In the browser** (the latest release): https://app.linked.archi/la-gram/

      **Desktop apps** — unzip and open; nothing else to install. They are not signed: the first time,
      macOS asks you to allow it in *System Settings › Privacy & Security › Open Anyway*, and Windows
      in *More info › Run anyway*.
    assets:
      links:
        - name: macOS (Apple silicon)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/la-gram/$VERSION/la-gram-$VERSION-darwin-arm64.zip
          link_type: package
        - name: macOS (Intel)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/la-gram/$VERSION/la-gram-$VERSION-darwin-x64.zip
          link_type: package
        - name: Windows (x64)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/la-gram/$VERSION/la-gram-$VERSION-win32-x64.zip
          link_type: package
        - name: Linux (x64)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/la-gram/$VERSION/la-gram-$VERSION-linux-x64.tar.gz
          link_type: package
        - name: Linux (arm64)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/la-gram/$VERSION/la-gram-$VERSION-linux-arm64.tar.gz
          link_type: package
        - name: Web app
          url: https://app.linked.archi/la-gram/
          link_type: other
