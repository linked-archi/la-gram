<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>la-gram — RDF Architecture Modeller</title>
  <!-- diagram-js's own stylesheet, emitted next to the bundle by
       CopyWebpackPlugin. Without it the canvas draws but selection outlines,
       the palette and the context pad are unstyled and effectively invisible. -->
  <link rel="stylesheet" href="diagram-js.css" />
  <style>
    /* ── Base layout ───────────────────────────────────────────────────
       app-shell sizes itself with height: 100%, which collapses to zero
       unless every ancestor has a resolved height. */
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #202124;
      background: #f1f3f4;
      overflow: hidden;
    }

    #app {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    app-shell {
      display: block;
      height: 100%;
      width: 100%;
    }

    [hidden] {
      display: none !important;
    }

    /* ── Slotted panels ────────────────────────────────────────────────
       These live in the light DOM (they are assigned into app-shell's
       named slots), so document-level CSS applies to the host elements. */
    palette-panel,
    model-explorer,
    property-panel,
    validation-panel,
    sparql-editor,
    catalog-view,
    matrix-view {
      display: block;
      background: #fff;
      border: 1px solid #dadce0;
      box-sizing: border-box;
      min-height: 0;
      overflow: auto;
    }

    /* Center area: the tool strip, the diagram host, and the alternative
       catalog/matrix views. A column flexbox rather than a block, so the
       toolbar takes its own height and the diagram host takes the rest —
       `height: 100%` on the host would otherwise overflow by the strip. */
    .la-canvas-area {
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #dadce0;
      overflow: hidden;
    }

    .la-diagram-host {
      /* `min-height: 0` is what lets a flex item shrink below its content;
         without it the host refuses to fit and the strip is pushed away. */
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background:
        linear-gradient(#eceff1 1px, transparent 1px) 0 0 / 20px 20px,
        linear-gradient(90deg, #eceff1 1px, transparent 1px) 0 0 / 20px 20px,
        #fff;
    }

    .la-canvas-area > catalog-view,
    .la-canvas-area > matrix-view {
      border: none;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }

    /* ── diagram-js inside .la-diagram-host ────────────────────────────
       diagram-js.css styles its own furniture; these rules cover what it
       leaves to the host application: making its container fill the host,
       keeping the grid background visible behind the SVG, and giving the
       notation elements sensible cursors and hover/selection feedback. */
    .la-diagram-host .djs-container {
      height: 100%;
      width: 100%;
      background: transparent;
    }

    .la-diagram-host .djs-container svg {
      background: transparent;
    }

    /* Selection and hover. diagram-js toggles .selected / .hover on
       .djs-element and paints .djs-outline; the defaults are tuned for
       bpmn-js's palette, so restate them in this app's accent colour. */
    .la-diagram-host .djs-element.selected .djs-outline {
      stroke: #1a73e8;
      stroke-width: 1.5px;
      stroke-dasharray: 3 3;
      visibility: visible;
    }

    .la-diagram-host .djs-element.hover .djs-outline {
      stroke: #7baaf7;
      stroke-width: 1px;
      visibility: visible;
    }

    .la-diagram-host .la-shape-body {
      cursor: move;
    }

    .la-diagram-host .la-shape-label {
      pointer-events: none;
      user-select: none;
    }

    /* Badge glyphs must not swallow clicks meant for the shape. */
    .la-diagram-host .la-shape-badge {
      pointer-events: none;
    }

    /* The context pad and the popup menus are absolutely positioned inside
       .djs-container, so the host must establish a containing block. */
    .la-diagram-host {
      position: relative;
    }

    .la-diagram-host .djs-context-pad .entry {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 11px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
    }

    .la-diagram-host .djs-context-pad .entry:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
    }

    /* The providers name their entries by class; give the two built-in ones a
       readable glyph so the pad is usable without an icon font. */
    .la-diagram-host .context-pad-delete::before {
      content: "\00d7";
    }

    /* Delete from the model (every view): a heavier mark than the per-view ×. */
    .la-diagram-host .context-pad-delete-model::before {
      content: "\2716";
      color: #c5221f;
    }

    .la-diagram-host .context-pad-connect::before {
      content: "\2192";
    }

    /* Append: opens a popup menu of the element types the metamodel permits a
       relationship to. Present only when there is at least one. */
    .la-diagram-host .context-pad-append::before {
      content: "\002b";
    }

    /* On a connection, the pad names the relationship type and opens the
       replace popup menu. Present only when the metamodel offers a choice. */
    .la-diagram-host .context-pad-replace::before {
      content: "\270e";
    }

    /* ── Relationship-type popup menu ──────────────────────────────────
       diagram-js.css styles the menu completely (.djs-popup and friends,
       including the search box and the dimmer description line), and the
       --popup-* variables it reads are declared on .djs-parent, which is the
       container the menu is appended to. Two things are left to the host app:
       the font, since diagram-js asks for IBM Plex Sans and nothing ships it,
       and a mark for the type currently in force — diagram-js's `active` flag
       only applies to header entries, so the provider signals it with a class. */
    .la-diagram-host .djs-popup {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .la-diagram-host .djs-popup .la-relationship-type-current .djs-popup-label {
      font-weight: 600;
    }

    .la-diagram-host .djs-popup .la-relationship-type-current .djs-popup-label::after {
      content: " \2713";
      color: #1a73e8;
    }

    /* Append-target entries share that menu's styling. They are draggable —
       `PopupMenuItem` renders every entry `draggable` and the provider registers
       a `dragstart` action — so say so with the cursor. */
    .la-diagram-host .djs-popup .la-append-target {
      cursor: grab;
    }

    .la-diagram-host .djs-popup .la-append-target:active {
      cursor: grabbing;
    }

    /* ── Canvas markers ────────────────────────────────────────────────
       diagram-js markers are CSS classes on the element's .djs-element group. */

    /* Outside the open view's viewpoint: still there, still editable, greyed. */
    .la-diagram-host .djs-element.la-outside-viewpoint .djs-visual {
      opacity: 0.35;
    }

    /* A SHACL violation on the concept. */
    .la-diagram-host .djs-element.la-violation .djs-visual > :first-child {
      stroke: #d93025 !important;
      stroke-width: 2.5px !important;
    }
    .la-diagram-host .djs-connection.la-violation .djs-visual > path {
      stroke: #d93025 !important;
    }

    /* Selected by another collaborator, and so locked here. */
    .la-diagram-host .djs-element.la-remote-selected .djs-outline {
      visibility: visible;
      stroke: #e8710a;
      stroke-width: 2px;
      stroke-dasharray: none;
    }
    .la-diagram-host .djs-element.la-locked {
      cursor: not-allowed;
    }

    app-toolbar {
      display: flex;
    }

    /* ── Dialogs (ui/dialogs.ts) ───────────────────────────────────────── */
    .la-dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(32, 33, 36, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .la-dialog {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      width: min(520px, calc(100vw - 32px));
      max-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }
    .la-dialog-title {
      padding: 16px 20px 8px;
      font-weight: 600;
      font-size: 16px;
    }
    .la-dialog-body {
      padding: 4px 20px 12px;
      overflow: auto;
    }
    .la-dialog-body p {
      margin: 0 0 8px;
    }
    .la-dialog-label {
      display: block;
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 4px;
    }
    .la-input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font: inherit;
    }
    .la-input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }
    .la-form-row {
      margin-bottom: 12px;
    }
    .la-form-row.check {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .la-form-row.check .la-dialog-hint {
      flex-basis: 100%;
      margin-top: 0;
    }
    .la-dialog-hint {
      font-size: 12px;
      color: #80868b;
      margin-top: 4px;
    }
    .la-dialog-error {
      color: #d93025;
      font-size: 13px;
      margin-top: 4px;
    }
    .la-dialog-list {
      margin: 0;
      padding-left: 20px;
      color: #3c4043;
    }
    .la-dialog-info {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre;
      overflow-x: auto;
    }
    .la-dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 8px 20px 16px;
    }
    .la-button {
      font: inherit;
      padding: 6px 16px;
      border-radius: 4px;
      border: 1px solid #dadce0;
      background: #fff;
      cursor: pointer;
    }
    .la-button.primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    .la-button.primary.danger {
      background: #d93025;
      border-color: #d93025;
    }
    .la-choice-list {
      max-height: 50vh;
      overflow: auto;
      border: 1px solid #eee;
      border-radius: 4px;
    }
    .la-choice-group {
      padding: 6px 10px 2px;
      font-size: 11px;
      font-weight: 600;
      color: #5f6368;
      text-transform: uppercase;
    }
    .la-choice {
      padding: 6px 10px;
      cursor: pointer;
    }
    .la-choice:hover {
      background: #f1f3f4;
    }
    .la-choice.selected {
      background: #e8f0fe;
    }
    .la-choice.disabled {
      color: #9aa0a6;
      cursor: default;
    }
    .la-choice-detail {
      font-size: 12px;
      color: #80868b;
    }
    .la-toasts {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 2100;
    }
    .la-toast {
      background: #323232;
      color: #fff;
      padding: 10px 14px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      font-size: 13px;
    }
    .la-toast.warning {
      background: #b06000;
    }
    .la-toast.error {
      background: #c5221f;
    }

    /* Bottom bar: validation results next to the SPARQL editor. */
    .la-bottom-area {
      display: flex;
      align-items: stretch;
      gap: 4px;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }

    .la-bottom-area > validation-panel {
      flex: 1 1 40%;
    }

    .la-bottom-area > sparql-editor {
      flex: 1 1 60%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
</body>
</html>
