<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>la-gram</title>
  <!-- The desktop app's icon: the favicon's mark (favicon.svg) on a white tile,
       laid out on the macOS icon grid (an 824 px tile, 100 px around it for the
       shadow). Its renderings — app-icon.icns, .ico, .png — come from
       npm run icons; at 32 px and less they are the bare mark, legible there. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000000" stroke-opacity="0.08"/>
  <g transform="translate(232 232) scale(17.5)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.6">
      <path d="M16 5.5 L3.5 27 H9" stroke="#00baa3"/>
      <path d="M13 27 L20.2 14.4 L27.5 27" stroke="#d55342"/>
      <path d="M18 27 H24" stroke="#efc945"/>
    </g>
    <circle cx="16" cy="5.5" r="4" fill="#00baa3"/>
    <circle cx="20.2" cy="14.4" r="3.6" fill="#d55342"/>
    <circle cx="27.5" cy="27" r="3.6" fill="#efc945"/>
  </g>
</svg>
